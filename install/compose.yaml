services:
  sub2api:
    image: ghcr.io/wei-shaw/sub2api:0.2.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - app_data:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?required}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -T, "5", -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_DB: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: [CMD, pg_isready, -U, sub2api, -d, sub2api]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:?required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
  mihomo:
    image: tree3-metacubexd-custom:1.273.1
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19090:9090"
    volumes:
      - mihomo_data:/data
    environment:
      CONTROL_TOKEN: ${CONTROL_TOKEN:?required}
      CLASH_SECRET: ${CLASH_SECRET:?required}
      DEFAULT_BACKEND_URL: http://127.0.0.1:19090
      TZ: Asia/Shanghai
    healthcheck:
      test: [CMD, wget, -q, -T, "5", -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 6s
      retries: 12
volumes:
  app_data:
  postgres_data:
  redis_data:
  mihomo_data:
